name: Build Tweak

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download SDKs
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          curl -L -o master.zip https://codeload.github.com/theos/sdks/zip/refs/heads/master
          unzip -q master.zip
          mv sdks-master/*.sdk .
          rm -rf sdks-master master.zip
          ls -la $THEOS/sdks

      - name: Build package
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SMSReader-deb
          path: packages/*.deb
